<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>温医助手</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout">
    <!-- 侧边栏：月份 → 周数（默认收起） -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-head">学期</div>
      <nav id="month-list" class="month-list"></nav>
    </aside>
    <div id="sidebar-mask" class="sidebar-mask hidden"></div>

    <div class="main">
      <!-- 顶栏 + 今日胶囊包成一个 sticky 整体：滚动时一起钉在顶部。
           两个子项都是普通流式元素，不靠 fixed 测量高度，不会被 flex 挤压 -->
      <div class="sticky-head">
        <header class="app-bar">
          <button id="btn-menu" class="icon-btn menu" title="选择周次">☰</button>
          <div class="term-info">
            <span id="week-label">第 1 周</span>
            <span id="student-label" class="student"></span>
          </div>
          <div class="actions">
            <button id="btn-bell" class="icon-btn" title="节假日通知">🔔</button>
            <!-- 日志入口（调试用，默认隐藏：铃铛占了位置）
            <button id="btn-log" class="icon-btn" title="运行日志">≡</button>
            -->
            <button id="btn-refresh" class="icon-btn" title="更新课表">↻</button>
            <button id="btn-delete" class="icon-btn danger" title="删除课表">🗑</button>
          </div>
        </header>

        <!-- 当日课程胶囊：今天有几节课一眼看到 -->
        <div id="today-strip" class="today-strip hidden"></div>
      </div>

      <main id="schedule" class="schedule"></main>

      <!-- 回到本周悬浮按钮：浏览非本周时出现 -->
      <button id="fab-today" class="fab-today hidden" title="回到本周">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4.5" width="18" height="16.5" rx="2.5"></rect>
          <line x1="3" y1="9.5" x2="21" y2="9.5"></line>
          <line x1="8" y1="2.5" x2="8" y2="6.5"></line>
          <line x1="16" y1="2.5" x2="16" y2="6.5"></line>
          <circle cx="12" cy="15" r="2.6" fill="currentColor" stroke="none"></circle>
        </svg>
      </button>

      <!-- 课程详情弹层（居中） -->
      <div id="detail-mask" class="detail-mask hidden">
        <div id="detail-card" class="detail-card"></div>
      </div>

      <!-- 日志弹层（功能保留，入口已隐藏） -->
      <div id="log-mask" class="detail-mask hidden">
        <div class="detail-card log-card">
          <h2>运行日志</h2>
          <textarea id="log-text" readonly></textarea>
          <button class="detail-close" id="log-close-btn">关闭</button>
        </div>
      </div>

      <!-- 通知中心（节假日/换课提醒） -->
      <div id="notif-mask" class="detail-mask hidden">
        <div class="detail-card notif-card">
          <button class="x-close" id="notif-close-btn" title="关闭">×</button>
          <h2>通知</h2>
          <div id="notif-list" class="notif-list"></div>
          <div class="notif-actions">
            <button id="notif-clear-read" class="btn-ghost">清除已读</button>
          </div>
        </div>
      </div>

      <!-- 通知详情 -->
      <div id="notif-detail-mask" class="detail-mask hidden">
        <div class="detail-card">
          <button class="x-close" id="notif-detail-close" title="关闭">×</button>
          <h2 id="notif-detail-title"></h2>
          <p class="d-teacher" id="notif-detail-date"></p>
          <p id="notif-detail-body" class="notif-body"></p>
        </div>
      </div>

      <!-- 删除确认弹层 -->
      <div id="confirm-mask" class="detail-mask hidden">
        <div class="detail-card confirm-card">
          <h2>删除课表数据？</h2>
          <p id="confirm-text" class="confirm-text"></p>
          <div class="confirm-actions">
            <button id="confirm-cancel" class="btn-ghost">取消</button>
            <button id="confirm-ok" class="btn-danger">删除</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 当日详情页（全屏，参考钉钉时间轴：一列一门课纵向铺开） -->
  <div id="day-view" class="day-view hidden">
    <header class="day-bar">
      <button id="day-back" class="icon-btn" title="返回">‹</button>
      <div class="day-title">
        <span id="day-heading">今日课表</span>
        <span id="day-sub" class="day-sub"></span>
      </div>
      <span class="day-spacer"></span>
    </header>
    <div id="day-body" class="day-body"></div>
  </div>

  <div id="empty-tip" class="empty-tip hidden">
    本地暂无课表数据。<br>
    请先在电脑上运行 <code>python main.py --year 2026 --term 1</code> 拉取。
  </div>

  <script src="app.js"></script>
</body>
</html>
